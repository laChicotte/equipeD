name: talents-connectes

services:
  postgres:
    image: postgres:17-alpine
    container_name: tc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talents}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-talents_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-talents_connectes}
      TZ: UTC
      PGTZ: UTC
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5450}:5432"
    volumes:
      - tc_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ─── API conteneurisée (optionnelle) ─────────────────────────────────────────
  # Démarrage : docker compose -f backend/docker-compose.yml --profile app up -d --build
  # En développement courant, préférer `pnpm dev:backend` (rechargement à chaud).
  migrate:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-talents}:${POSTGRES_PASSWORD:-talents_dev_password}@postgres:5432/${POSTGRES_DB:-talents_connectes}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    profiles: ["app"]
    build:
      context: ..
      dockerfile: backend/Dockerfile
      target: runtime
    container_name: tc-api
    restart: unless-stopped
    environment:
      NODE_ENV: ${API_NODE_ENV:-production}
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER:-talents}:${POSTGRES_PASSWORD:-talents_dev_password}@postgres:5432/${POSTGRES_DB:-talents_connectes}?schema=public
      WEB_ORIGINS: ${WEB_ORIGINS:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET est obligatoire}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
    ports:
      - "127.0.0.1:${API_PORT:-4010}:4000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  tc_pgdata:
