# Blueprint Render : un service web gratuit (Next.js + API dans le même conteneur) et une base
# PostgreSQL gratuite. Mode d'emploi : docs/deploiement.md.
services:
  - type: web
    name: talentsconnect
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: talentsconnect-db
          property: connectionString
      # Généré par Render (jamais dans le dépôt).
      - key: SESSION_SECRET
        generateValue: true
      # Comptes de démonstration fictifs, chargés une seule fois sur une base vide.
      - key: SEED_DEMO
        value: "true"
      # Render ajoute l'IP du client à X-Forwarded-For : un saut de confiance.
      - key: TRUST_PROXY
        value: "1"
      # Serveur STUN public : appels audio et vidéo entre réseaux différents (sans relais TURN).
      - key: STUN_URLS
        value: stun:stun.l.google.com:19302
      # Facultatif : à saisir dans le tableau de bord Render (l'assistance par IA reste masquée sans clé).
      - key: OPENAI_API_KEY
        sync: false
      # Garde-fou de coût pour une phase de test.
      - key: AI_GLOBAL_DAILY_LIMIT
        value: "300"

databases:
  - name: talentsconnect-db
    plan: free
    region: frankfurt
    databaseName: talents_connectes
    user: talents
