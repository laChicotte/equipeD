name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — typecheck, lint, tests unitaires et e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: talents
          POSTGRES_PASSWORD: talents_ci_password
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U talents"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      TEST_DATABASE_URL: postgresql://talents:talents_ci_password@localhost:5432/talents_connectes_test?schema=public
      DATABASE_URL: postgresql://talents:talents_ci_password@localhost:5432/talents_connectes_test?schema=public
      SESSION_SECRET: ci-only-secret-not-for-production-0123456789
      WEB_ORIGINS: http://localhost:3000
      SWAGGER_ENABLED: 'false'

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Installation
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm --filter backend typecheck

      - name: Lint
        run: pnpm --filter backend lint

      - name: Tests unitaires
        run: pnpm --filter backend test

      - name: Tests e2e (PostgreSQL réel)
        run: pnpm --filter backend test:e2e

      - name: Build
        run: pnpm --filter backend build
